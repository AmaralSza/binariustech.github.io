<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binarius Tech - Soluções em Informática</title>
    <!-- Google Fonts & FontAwesome para ícones modernos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Folha de Estilos Externa -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header / Navbar -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo" id="logo-text"><i class="fa-solid fa-microchip"></i> <span>Binarius Tech</span></a>
            <ul class="nav-links">
                <li><a href="#home">Início</a></li>
                <li><a href="#services">Serviços</a></li>
                <li><a href="#about">Sobre</a></li>
                <li><a href="https://linktr.ee/binarius.tech">Suporte</a></li>
                <li><a href="#contact" class="btn-cta" id="nav-cta">Contato</a></li>
            </ul>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1 id="hero-title"></h1>
            <p id="hero-subtitle"></p>
            <div class="hero-buttons">
                <a href="#" class="btn-cta" id="hero-btn-primary"></a>
                <a href="#services" class="btn-outline" id="hero-btn-secondary"></a>
            </div>
        </div>
        <!-- Carrossel no Hero -->
        <div class="carousel-container">
            <div class="carousel-slides" id="carousel-slides"></div>
            <button class="carousel-btn prev" onclick="moveSlide(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="carousel-btn next" onclick="moveSlide(1)"><i class="fa-solid fa-chevron-right"></i></button>
            <div class="carousel-dots" id="carousel-dots"></div>
        </div>
    </section>

    <!-- Serviços -->
    <section id="services">
        <div class="section-title">
            <h2 id="services-title">O que fazemos por você</h2>
            <p id="services-subtitle">Tecnologia de ponta e suporte técnico ágil e eficiente</p>
        </div>
        <div class="services-grid" id="services-container"></div>
    </section>

    <!-- Sobre -->
    <section id="about">
        <div class="about-content">
            <div class="about-image">
                <img id="about-img-src" src="" alt="Sobre a Binarius Tech">
            </div>
            <div class="about-text">
                <h3 id="about-title"></h3>
                <p id="about-desc"></p>
                <div class="about-features" id="features-container"></div>
            </div>
        </div>
    </section>

    <!-- Rodapé / Contato -->
    <footer id="contact">
        <div class="footer-content">
            <a href="#" class="logo"><span>Binarius Tech</span></a>
            <p id="footer-text"></p>
            <div class="social-icons" id="social-container"></div>
            <p class="copyright" id="copyright-text"></p>
        </div>
    </footer>

    <!-- Scripts Externos -->
    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
